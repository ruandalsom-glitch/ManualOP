<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhamento de Reportes - Jira | ManualOP</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #0b1120;
            --bg-card: #131b2e;
            --bg-card-hover: #1c283f;
            --border-color: rgba(255, 255, 255, 0.08);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;

            --cyan-primary: #00f2fe;
            --blue-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --blue-btn: #2563eb;
            --blue-jira-icon: #2563eb;

            --status-amber-bg: rgba(245, 158, 11, 0.15);
            --status-amber-text: #f59e0b;
            
            --status-blue-bg: rgba(56, 189, 248, 0.15);
            --status-blue-text: #38bdf8;
            
            --status-green-bg: rgba(16, 185, 129, 0.15);
            --status-green-text: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header aligned with site visual style */
        header {
            background: #0f172a;
            border-bottom: 1px solid var(--border-color);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-brand i {
            font-size: 22px;
            color: var(--cyan-primary);
            background: rgba(0, 242, 254, 0.1);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        .header-brand h1 {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.2px;
            color: var(--text-main);
        }

        .header-brand p {
            font-size: 12.5px;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-sync {
            background: var(--blue-gradient);
            color: #0b1120;
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 242, 254, 0.25);
        }

        .btn-sync:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(0, 242, 254, 0.35);
        }

        /* Main Container */
        main {
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
            padding: 28px 32px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* Top Summary Cards Grid */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 16px;
        }

        .card-stat {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card-stat:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .card-stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .card-stat-icon.total { background: rgba(0, 242, 254, 0.12); color: var(--cyan-primary); }
        .card-stat-icon.open { background: rgba(245, 158, 11, 0.12); color: #f59e0b; }
        .card-stat-icon.progress { background: rgba(56, 189, 248, 0.12); color: #38bdf8; }
        .card-stat-icon.done { background: rgba(16, 185, 129, 0.12); color: #10b981; }

        .card-stat-val h3 {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.1;
        }

        .card-stat-val p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        /* Jira Filter Toolbar Replication */
        .jira-toolbar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .search-field {
            position: relative;
            flex: 1;
            min-width: 260px;
        }

        .search-field i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 14px;
        }

        .search-field input {
            width: 100%;
            background: #0b1120;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 9.5px 14px 9.5px 38px;
            border-radius: 8px;
            font-size: 13.5px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-field input:focus {
            border-color: var(--cyan-primary);
        }

        .filters-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-badge-select {
            background: #0b1120;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 9.5px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .filter-badge-select:focus {
            border-color: var(--cyan-primary);
        }

        /* Table Design aligned with site table aesthetics */
        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13.5px;
        }

        thead {
            background: #0f172a;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            padding: 14px 18px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.15s ease;
        }

        tbody tr:hover {
            background: var(--bg-card-hover);
        }

        td {
            padding: 14px 18px;
            color: var(--text-main);
            vertical-align: middle;
        }

        /* Icons Jira Style */
        .type-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: rgba(37, 99, 235, 0.15);
            color: #3b82f6;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .issue-ref-badge {
            font-family: monospace;
            font-weight: 700;
            color: var(--cyan-primary);
            background: rgba(0, 242, 254, 0.08);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 242, 254, 0.2);
            display: inline-block;
            font-size: 13px;
        }

        .issue-desc {
            font-weight: 500;
            color: var(--text-main);
            max-width: 520px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .badge-status.aberto { background: var(--status-amber-bg); color: var(--status-amber-text); }
        .badge-status.andamento { background: var(--status-blue-bg); color: var(--status-blue-text); }
        .badge-status.concluido { background: var(--status-green-bg); color: var(--status-green-text); }

        .user-tag {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-avatar-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(0, 242, 254, 0.12);
            color: var(--cyan-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        .empty-box {
            padding: 42px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-box i {
            font-size: 38px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 13px;
            height: 13px;
            border: 2px solid rgba(11, 17, 32, 0.4);
            border-radius: 50%;
            border-top-color: #0b1120;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            padding: 18px;
            text-align: center;
            font-size: 12px;
            color: var(--text-dim);
            border-top: 1px solid var(--border-color);
            background: #0f172a;
        }
    </style>
</head>
<body>

    <!-- Header Navigation Aligned with ManualOP -->
    <header>
        <div class="header-brand">
            <i class="fa-solid fa-list-check"></i>
            <div>
                <h1>Acompanhamento de Reportes</h1>
                <p>Portal de Chamados EntreGô (SMENTGO)</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-sync" id="btnSync" onclick="carregarDadosReais()">
                <i class="fa-solid fa-rotate"></i>
                <span id="btnSyncText">Atualizar Dados</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Metric Summary Cards -->
        <div class="summary-cards">
            <div class="card-stat">
                <div class="card-stat-icon total">
                    <i class="fa-solid fa-inbox"></i>
                </div>
                <div class="card-stat-val">
                    <h3 id="statTotal">0</h3>
                    <p>Total de Reportes</p>
                </div>
            </div>

            <div class="card-stat">
                <div class="card-stat-icon open">
                    <i class="fa-solid fa-clock"></i>
                </div>
                <div class="card-stat-val">
                    <h3 id="statOpen">0</h3>
                    <p>Em Aberto / Pendentes</p>
                </div>
            </div>

            <div class="card-stat">
                <div class="card-stat-icon progress">
                    <i class="fa-solid fa-spinner"></i>
                </div>
                <div class="card-stat-val">
                    <h3 id="statProgress">0</h3>
                    <p>Em Verificação / Atendimento</p>
                </div>
            </div>

            <div class="card-stat">
                <div class="card-stat-icon done">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div class="card-stat-val">
                    <h3 id="statDone">0</h3>
                    <p>Concluídos / Resolvidos</p>
                </div>
            </div>
        </div>

        <!-- Jira Replicated Filter Toolbar -->
        <div class="jira-toolbar">
            <div class="search-field">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Buscar por código (ex: SMENTGO-1740), resumo ou solicitante..." oninput="filtrarTabela()">
            </div>

            <div class="filters-row">
                <!-- Dropdown replica do Jira: Tipo de solicitação -->
                <select class="filter-badge-select" id="typeFilter" onchange="filtrarTabela()">
                    <option value="">Tipo de solicitação (Todos)</option>
                    <option value="Escala">Escalas / Modificações</option>
                    <option value="Promoção">Promoções / Ações</option>
                    <option value="Problema">Bugs / Erros / Modais</option>
                    <option value="Geral">Geral / Outros</option>
                </select>

                <!-- Dropdown replica do Jira: Status -->
                <select class="filter-badge-select" id="statusFilter" onchange="filtrarTabela()">
                    <option value="">Status (Todos)</option>
                    <option value="aberto">Aberto / Pendente</option>
                    <option value="andamento">Em verificação / atendimento</option>
                    <option value="concluido">Concluído / Resolvido</option>
                </select>

                <!-- Dropdown replica do Jira: Solicitantes (Tudo) -->
                <select class="filter-badge-select" id="reporterFilter" onchange="filtrarTabela()">
                    <option value="">Solicitante: Tudo</option>
                    <!-- Preenchido dinamicamente via JS -->
                </select>
            </div>
        </div>

        <!-- Table Display (Puramente Indicativa e Textual) -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th style="width: 60px; text-align: center;">Tipo</th>
                        <th>Referência</th>
                        <th>Resumo</th>
                        <th>Status</th>
                        <th>Solicitante</th>
                    </tr>
                </thead>
                <tbody id="reportsTableBody">
                    <!-- Populated via Javascript -->
                </tbody>
            </table>
        </div>

    </main>

    <footer>
        <p>ManualOP &copy; 2026 - Central de Acompanhamento de Reportes (EntreGô)</p>
    </footer>

    <script>
        let reportesData = [];

        function getIconForType(tipo, summary) {
            const t = (tipo || '').toLowerCase();
            const s = (summary || '').toLowerCase();

            if (t.includes('escala') || s.includes('escala')) {
                return '<div class="type-icon" title="Sugestão / Alteração de Escala"><i class="fa-solid fa-calendar-pen"></i></div>';
            } else if (t.includes('promo') || s.includes('promo') || s.includes('contest')) {
                return '<div class="type-icon" title="Contestação / Registro de Promoção"><i class="fa-solid fa-tags"></i></div>';
            } else if (t.includes('bug') || t.includes('problema') || s.includes('erro') || s.includes('modal') || s.includes('falha')) {
                return '<div class="type-icon" title="Problema / Erro / Modal"><i class="fa-solid fa-bug"></i></div>';
            } else {
                return '<div class="type-icon" title="Solicitação Geral"><i class="fa-solid fa-circle-question"></i></div>';
            }
        }

        function popularFiltroSolicitantes(dados) {
            const selectReporter = document.getElementById('reporterFilter');
            const solicitantes = new Set();

            dados.forEach(d => {
                if (d.reporter && d.reporter.trim()) {
                    solicitantes.add(d.reporter.trim());
                }
            });

            // Limpa opções antigas mantendo a padrão "Tudo"
            selectReporter.innerHTML = '<option value="">Solicitante: Tudo</option>';
            
            Array.from(solicitantes).sort().forEach(nome => {
                const opt = document.createElement('option');
                opt.value = nome;
                opt.innerText = nome;
                selectReporter.appendChild(opt);
            });
        }

        function renderTabela(dados) {
            const tbody = document.getElementById('reportsTableBody');
            tbody.innerHTML = '';

            if (!dados || dados.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            <div class="empty-box">
                                <i class="fa-solid fa-inbox"></i>
                                <p>Nenhum reporte encontrado para os filtros selecionados.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            dados.forEach(item => {
                const tr = document.createElement('tr');

                // Class do Badge de Status
                let statusClass = 'aberto';
                const st = (item.status || '').toLowerCase();
                if (st.includes('atendimento') || st.includes('andamento') || st.includes('progresso') || st.includes('verificação') || st.includes('verificacao')) {
                    statusClass = 'andamento';
                } else if (st.includes('conclu') || st.includes('resolv') || st.includes('fechad')) {
                    statusClass = 'concluido';
                }

                // Ícone Jira do tipo
                const iconHtml = getIconForType(item.type, item.summary);

                // Avatar com iniciais
                const nome = item.reporter || 'N/A';
                const inicial = nome.charAt(0).toUpperCase();

                tr.innerHTML = `
                    <td style="text-align: center;">
                        ${iconHtml}
                    </td>
                    <td>
                        <span class="issue-ref-badge">${item.issue_key}</span>
                    </td>
                    <td>
                        <div class="issue-desc" title="${item.summary}">${item.summary}</div>
                    </td>
                    <td>
                        <span class="badge-status ${statusClass}">
                            <i class="fa-solid fa-circle" style="font-size: 6px;"></i>
                            ${item.status}
                        </span>
                    </td>
                    <td>
                        <div class="user-tag">
                            <div class="user-avatar-circle">${inicial}</div>
                            <span>${nome}</span>
                        </div>
                    </td>
                `;

                tbody.appendChild(tr);
            });

            atualizarMetrics(dados);
        }

        function atualizarMetrics(dados) {
            let total = dados.length;
            let open = 0;
            let progress = 0;
            let done = 0;

            dados.forEach(item => {
                const st = (item.status || '').toLowerCase();
                if (st.includes('atendimento') || st.includes('andamento') || st.includes('progresso') || st.includes('verificação') || st.includes('verificacao')) {
                    progress++;
                } else if (st.includes('conclu') || st.includes('resolv') || st.includes('fechad')) {
                    done++;
                } else {
                    open++;
                }
            });

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statOpen').innerText = open;
            document.getElementById('statProgress').innerText = progress;
            document.getElementById('statDone').innerText = done;
        }

        function filtrarTabela() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const typeFilter = document.getElementById('typeFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const reporterFilter = document.getElementById('reporterFilter').value;

            const filtrados = reportesData.filter(item => {
                // Filtro por Texto
                const matchQuery = (item.issue_key || '').toLowerCase().includes(query) ||
                                   (item.summary || '').toLowerCase().includes(query) ||
                                   (item.reporter || '').toLowerCase().includes(query);

                // Filtro por Tipo de Solicitação
                let matchType = true;
                if (typeFilter) {
                    const t = (item.type || '').toLowerCase();
                    const s = (item.summary || '').toLowerCase();
                    if (typeFilter === 'Escala') {
                        matchType = t.includes('escala') || s.includes('escala');
                    } else if (typeFilter === 'Promoção') {
                        matchType = t.includes('promo') || s.includes('promo') || s.includes('contest');
                    } else if (typeFilter === 'Problema') {
                        matchType = t.includes('bug') || t.includes('problema') || s.includes('erro') || s.includes('modal') || s.includes('falha');
                    } else if (typeFilter === 'Geral') {
                        matchType = !s.includes('escala') && !s.includes('promo') && !s.includes('contest') && !s.includes('erro') && !s.includes('modal');
                    }
                }

                // Filtro por Status
                let matchStatus = true;
                const st = (item.status || '').toLowerCase();
                if (statusFilter === 'aberto') {
                    matchStatus = !st.includes('atendimento') && !st.includes('andamento') && !st.includes('verificação') && !st.includes('verificacao') && !st.includes('conclu') && !st.includes('resolv');
                } else if (statusFilter === 'andamento') {
                    matchStatus = st.includes('atendimento') || st.includes('andamento') || st.includes('progresso') || st.includes('verificação') || st.includes('verificacao');
                } else if (statusFilter === 'concluido') {
                    matchStatus = st.includes('conclu') || st.includes('resolv') || st.includes('fechad');
                }

                // Filtro por Solicitante ("Tudo")
                let matchReporter = true;
                if (reporterFilter) {
                    matchReporter = (item.reporter || '').trim() === reporterFilter;
                }

                return matchQuery && matchType && matchStatus && matchReporter;
            });

            renderTabela(filtrados);
        }

        async function carregarDadosReais() {
            const btn = document.getElementById('btnSync');
            const txt = document.getElementById('btnSyncText');
            
            btn.disabled = true;
            txt.innerHTML = '<span class="spinner"></span> Carregando...';

            try {
                const response = await fetch('jira_reports_data.json?cache=' + Date.now());
                if (response.ok) {
                    reportesData = await response.json();
                    popularFiltroSolicitantes(reportesData);
                }
            } catch (e) {
                console.log("Erro ao carregar jira_reports_data.json:", e);
            }

            filtrarTabela();
            btn.disabled = false;
            txt.innerText = 'Atualizar Dados';
        }

        // Renderização Inicial
        document.addEventListener('DOMContentLoaded', () => {
            carregarDadosReais();
        });
    </script>
</body>
</html>
